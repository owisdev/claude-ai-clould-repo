<text x="550.0" y="243.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f4a2d" text-anchor="middle">On the VM:  deploy/deploy.sh [commit]</text>
<text x="550.0" y="261.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">1. find the commit  ·  2. move /opt/ofd/repo to it  ·  3. docker compose pull</text>
<text x="550.0" y="276.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">4. compose up -d  ·  5. wait until healthy (+ tunnel connected)</text>
<text x="550.0" y="291.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">logged in /opt/ofd/deploys.log · .env never touched</text>
