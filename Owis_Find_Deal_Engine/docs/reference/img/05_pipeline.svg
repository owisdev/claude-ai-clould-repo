<text x="280.0" y="238.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#123a73" text-anchor="middle">POST /search · POST /searches</text>
<text x="280.0" y="253.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#123a73" text-anchor="middle">GET /searches/{id} · POST /mcp</text>
<text x="280.0" y="268.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#123a73" text-anchor="middle">country allowed? title 2–200?</text>
<path d="M 1050 147 L 1050 170 L 280 170 L 280 188" fill="none" stroke="#4a5262" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="470" y="190" width="270" height="110" rx="10" fill="#e6f6ee" stroke="#2a9a62" stroke-width="1.6"/>
<text x="605.0" y="213.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f4a2d" text-anchor="middle">metering</text>
<text x="605.0" y="231.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">cached answer → free</text>
<text x="605.0" y="246.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">else Take 1 from daily allowance</text>
<text x="605.0" y="261.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f4a2d" text-anchor="middle">→ 402 / 429 when used up</text>
