# Production add-on (the Oracle VM): the server image comes ready-made from
# GitHub's container registry (built by CI from main, amd64 + arm64), and
# cloudflared (the Cloudflare Tunnel) brings https://globalprodsearch.dawirli.com
# to the server without any open web port. deploy/deploy.sh runs it:
#
#   deploy/deploy.sh             # the newest image built from main
#   deploy/deploy.sh <commit>    # that commit (also to roll back)
#
# By hand (IMAGE_TAG = a full commit id that CI built):
#   IMAGE_TAG=<commit> docker compose -f docker-compose.yml -f compose.prod.yml up -d
#
# cloudflared starts only with the "tunnel" profile, which deploy.sh turns
# on when TUNNEL_TOKEN is set in .env.

services:
  server:
    image: ${OFD_IMAGE:-ghcr.io/owisdev/owis_find_deal_engine}:${IMAGE_TAG:?set IMAGE_TAG to the commit to run (deploy/deploy.sh does)}
    build: !reset null

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    # The tunnel and its public hostname are made in the Cloudflare
    # dashboard (Zero Trust -> Networks -> Tunnels); the token connects
    # this VM to it. Service URL there: http://server:3002
    command: [tunnel, --no-autoupdate, --metrics, "127.0.0.1:2000", run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      # The only address whose CF-Connecting-IP header the server believes
      # (TRUSTED_PROXIES in docker-compose.yml).
      tunnel: { ipv4_address: 10.203.20.10 }
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 128m
    pids_limit: 128
