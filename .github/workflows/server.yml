name: server

on:
  push:
    paths:
      - "Owis_Find_Deal_Engine/server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "Owis_Find_Deal_Engine/server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Owis_Find_Deal_Engine/server

jobs:
  test:
    name: format, vet, test, vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Latest patch of the supported Go line (security fixes).
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: Owis_Find_Deal_Engine/server/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Modules tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: docker image and compose file
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose files
        run: |
          printf 'SEARXNG_SECRET=ci\nREDIS_PASSWORD=ci\n' > .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.dev.yml config -q
          rm .env

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: Owis_Find_Deal_Engine/server
          push: false
          load: true
          tags: owis_find_deal_engine:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint /owis_find_deal_engine owis_find_deal_engine:ci healthcheck \
            && { echo "healthcheck passed without a server"; exit 1; } || true
          # Without configuration the server must refuse to start.
          if docker run --rm owis_find_deal_engine:ci; then
            echo "server started without required config"; exit 1
          fi
